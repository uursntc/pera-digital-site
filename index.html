<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PERA DIGITAL</title>
<meta name="description" content="">
<meta name="theme-color" content="#3E3936">
<link rel="icon" href="assets/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="announce" class="announce" hidden></div>
<header class="nav" id="top">
  <a class="brand" href="#top" aria-label="PERA DIGITAL"><img id="brandLogo" alt="" hidden><span id="brandName">PERA DIGITAL</span></a>
  <nav id="navLinks" class="nav-links" aria-label="Ana menü"></nav>
  <a id="navCta" class="btn btn-sm" href="#basvuru">Başvur</a>
  <button id="burger" class="burger" aria-label="Menü" aria-expanded="false"><span></span><span></span></button>
</header>

<main>
  <section class="hero" id="hero">
    <div class="wrap hero-grid">
      <div class="hero-copy">
        <span class="badge" id="heroBadge"></span>
        <h1><span id="heroTitle"></span> <em id="heroAccent"></em></h1>
        <p class="lead" id="heroText"></p>
        <div class="cta-row">
          <a class="btn" id="heroCta1" href="#basvuru"></a>
          <a class="btn btn-ghost" id="heroCta2" href="#yaklasim"></a>
        </div>
        <dl class="stats" id="heroStats"></dl>
      </div>
      <aside class="hero-card" aria-hidden="true">
        <img id="heroLogo" alt="" hidden>
        <ol class="steps-mini">
          <li><b>01</b> Perspektif</li>
          <li><b>02</b> Etki</li>
          <li><b>03</b> Rezonans</li>
          <li><b>04</b> Aksiyon</li>
        </ol>
      </aside>
    </div>
  </section>

  <section class="marquee" id="marqueeSec" hidden>
    <p class="marquee-title" id="marqueeTitle"></p>
    <div class="marquee-row" id="marqueeRow"></div>
  </section>

  <section class="sec" id="yaklasim"><div class="wrap" id="approach"></div></section>
  <section class="sec sec-dark" id="hakkimizda"><div class="wrap" id="about"></div></section>
  <section class="sec" id="hizmetler"><div class="wrap" id="services"></div></section>
  <section class="sec sec-cream" id="sonuclar"><div class="wrap" id="results"></div></section>
  <section class="sec" id="surec"><div class="wrap" id="process"></div></section>

  <section class="sec sec-sage" id="basvuru">
    <div class="wrap apply-grid">
      <div id="applyIntro"></div>
      <form class="card form" id="applyForm" novalidate>
        <h3 id="formTitle"></h3>
        <div class="grid2">
          <label>Ad Soyad<input name="ad_soyad" required autocomplete="name"></label>
          <label>Marka / İşletme adı<input name="marka" required></label>
          <label>E-posta<input type="email" name="email" required autocomplete="email"></label>
          <label>Telefon / WhatsApp<input type="tel" name="telefon" required autocomplete="tel"></label>
          <label>Instagram hesabı<input name="instagram" placeholder="@markaniz" required></label>
          <label>Web sitesi <small>(varsa)</small><input name="web" placeholder="https://"></label>
          <label>Sektör<select name="sektor" id="fSector" required></select></label>
          <label>Aylık reklam bütçesi<select name="butce" id="fBudget"></select></label>
        </div>
        <label>İlgilendiğiniz hizmet<select name="hizmet" id="fService"></select></label>
        <label>Markanızdan kısaca bahsedin<textarea name="mesaj" rows="4" placeholder="Şu an en çok nerede zorlanıyorsunuz?"></textarea></label>
        <input type="text" name="_gotcha" tabindex="-1" autocomplete="off" class="hp" aria-hidden="true">
        <label class="check"><input type="checkbox" name="kvkk" required> <span id="kvkkText"></span></label>
        <button class="btn btn-dark" type="submit" id="submitBtn"></button>
        <p class="form-msg" id="formMsg" role="status" aria-live="polite"></p>
      </form>
    </div>
  </section>

  <section class="sec" id="sss"><div class="wrap narrow" id="faq"></div></section>
</main>

<footer class="footer">
  <div class="wrap foot-grid">
    <div><strong id="footName"></strong><p id="footTag"></p></div>
    <div class="foot-links" id="footLinks"></div>
  </div>
  <p class="copy" id="footCopy"></p>
</footer>

<script src="app.js"></script>
</body>
</html>
